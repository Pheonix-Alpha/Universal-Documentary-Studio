# Universal Documentary Studio - main configuration

mock_mode: false
local_gpu_enabled: true
projects_root: projects

resource:
  vram_safety_margin_gb: 1.5

tts:
  provider: piper
  model_path: "/content/drive/MyDrive/uds_models/piper/en_US-ryan-high.onnx"
  use_cuda: false

video:
  long_form:
    width: 1920
    height: 1080
    fps: 24

  short:
    width: 1080
    height: 1920
    fps: 30

pipeline:
  target_duration_minutes: 10.0
  short_count: 4
  research_depth: standard

qa:
  ready_threshold: 90
  review_threshold: 80
  regenerate_threshold: 70
